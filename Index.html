<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoreo de Tendencias CRC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Babel for JSX transformation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        overflow-y: hidden;
      }
      
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }

      .web-section {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
      }
    </style>

    <!-- React y ReactDOM desde CDN (sin módulos ES6) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <style>
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Inter', sans-serif;
            z-index: 9999;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #error-display {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #fee;
            border: 2px solid #f00;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow: auto;
            display: none;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-size: 18px;">Cargando Monitoreo de Tendencias CRC...</p>
        <p id="loading-status" style="margin-top: 10px; font-size: 14px; opacity: 0.8;">Inicializando...</p>
    </div>
    <div id="error-display"></div>
    <div id="root"></div>
    
    <script>
        // Actualizar estado de carga
        function updateLoadingStatus(message) {
            const status = document.getElementById('loading-status');
            if (status) status.textContent = message;
        }
        
        // Capturar errores globales
        window.addEventListener('error', function(e) {
            const errorDisplay = document.getElementById('error-display');
            errorDisplay.style.display = 'block';
            errorDisplay.innerHTML += `<div style="border-bottom: 1px solid #f00; padding: 5px; margin: 5px 0;">
                <strong>ERROR:</strong> ${e.message}<br>
                <small>Archivo: ${e.filename}:${e.lineno}</small>
            </div>`;
            console.error('Error capturado:', e);
        });
        
        // Verificar que las librerías se cargaron
        window.addEventListener('load', function() {
            updateLoadingStatus('Verificando librerías...');
            
            if (typeof React === 'undefined') {
                alert('ERROR: React no se cargó. Por favor recarga la página.');
                return;
            }
            if (typeof ReactDOM === 'undefined') {
                alert('ERROR: ReactDOM no se cargó. Por favor recarga la página.');
                return;
            }
            
            updateLoadingStatus('Librerías cargadas, iniciando aplicación...');
        });
    </script>

    <script type="text/babel">
        updateLoadingStatus('Compilando JSX con Babel...');
        
        const { useState, useEffect, useRef } = React;
        
        // ===== COMPONENTES DE GRÁFICOS CSS/SVG MEJORADOS =====
        
        // Gráfico de barras apiladas con SVG
        const CSSBarChart = ({ data, dataKeys, colors, yLabel }) => {
            const chartWidth = 800;
            const chartHeight = 300;
            const padding = { top: 20, right: 40, bottom: 60, left: 60 };
            const innerWidth = chartWidth - padding.left - padding.right;
            const innerHeight = chartHeight - padding.top - padding.bottom;
            
            // Calcular valores máximos
            const totals = data.map(d => dataKeys.reduce((sum, key) => sum + (d[key.key] || 0), 0));
            const maxTotal = Math.max(...totals);
            
            const barWidth = innerWidth / data.length * 0.7;
            const barSpacing = innerWidth / data.length;
            
            return (
                <div className="w-full h-full flex flex-col items-center justify-center">
                    <svg viewBox={`0 0 ${chartWidth} ${chartHeight}`} className="w-full h-full">
                        {/* Grid lines */}
                        {[0, 1, 2, 3, 4].map(i => {
                            const y = padding.top + (innerHeight / 4) * i;
                            return (
                                <line key={i} x1={padding.left} y1={y} x2={chartWidth - padding.right} y2={y} 
                                      stroke="#e2e8f0" strokeWidth="1" strokeDasharray="4,4" />
                            );
                        })}
                        
                        {/* Bars */}
                        {data.map((item, idx) => {
                            const x = padding.left + idx * barSpacing + (barSpacing - barWidth) / 2;
                            const total = totals[idx];
                            let currentY = padding.top + innerHeight;
                            
                            return (
                                <g key={idx}>
                                    {dataKeys.map((dk, dkIdx) => {
                                        const value = item[dk.key] || 0;
                                        const height = (value / maxTotal) * innerHeight;
                                        const y = currentY - height;
                                        const rect = (
                                            <g key={dkIdx}>
                                                <rect
                                                    x={x}
                                                    y={y}
                                                    width={barWidth}
                                                    height={height}
                                                    fill={colors[dkIdx]}
                                                    className="transition-all duration-500"
                                                    style={{ cursor: 'pointer' }}
                                                >
                                                    <title>{`${dk.name}: ${value}`}</title>
                                                </rect>
                                            </g>
                                        );
                                        currentY = y;
                                        return rect;
                                    })}
                                    
                                    {/* X axis labels */}
                                    <text x={x + barWidth / 2} y={chartHeight - padding.bottom + 20} 
                                          textAnchor="middle" fontSize="12" fill="#64748b" fontWeight="600">
                                        {item.year}
                                    </text>
                                </g>
                            );
                        })}
                        
                        {/* Y axis label */}
                        <text x={15} y={chartHeight / 2} textAnchor="middle" fontSize="11" fill="#64748b" 
                              transform={`rotate(-90, 15, ${chartHeight / 2})`} fontWeight="500">
                            {yLabel}
                        </text>
                        
                        {/* Y axis values */}
                        {[0, 1, 2, 3, 4].map(i => {
                            const value = Math.round((maxTotal / 4) * (4 - i));
                            const y = padding.top + (innerHeight / 4) * i;
                            return (
                                <text key={i} x={padding.left - 10} y={y + 4} textAnchor="end" fontSize="10" fill="#94a3b8">
                                    {value}
                                </text>
                            );
                        })}
                    </svg>
                    
                    {/* Legend */}
                    <div className="flex flex-wrap justify-center gap-4 mt-2">
                        {dataKeys.map((dk, idx) => (
                            <div key={idx} className="flex items-center gap-2">
                                <div className="w-4 h-4 rounded" style={{ backgroundColor: colors[idx] }} />
                                <span className="text-[10px] text-slate-600 font-medium">{dk.name}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };
        
        // Gráfico de líneas con SVG mejorado
        const CSSLineChart = ({ data, lines, colors }) => {
            const chartWidth = 800;
            const chartHeight = 300;
            const padding = { top: 20, right: 40, bottom: 60, left: 60 };
            const innerWidth = chartWidth - padding.left - padding.right;
            const innerHeight = chartHeight - padding.top - padding.bottom;
            
            // Encontrar min y max de todos los datos
            const allValues = data.flatMap(d => lines.map(l => d[l.key] || 0));
            const minValue = Math.min(...allValues);
            const maxValue = Math.max(...allValues);
            const range = maxValue - minValue;
            
            // Función para escalar valores
            const scaleY = (value) => {
                const normalized = (value - minValue) / range;
                return padding.top + innerHeight - (normalized * innerHeight);
            };
            
            const scaleX = (index) => {
                return padding.left + (index / (data.length - 1)) * innerWidth;
            };
            
            return (
                <div className="w-full h-full flex flex-col items-center justify-center">
                    <svg viewBox={`0 0 ${chartWidth} ${chartHeight}`} className="w-full h-full">
                        {/* Grid lines */}
                        {[0, 1, 2, 3, 4].map(i => {
                            const y = padding.top + (innerHeight / 4) * i;
                            const value = Math.round(maxValue - (range / 4) * i);
                            return (
                                <g key={i}>
                                    <line x1={padding.left} y1={y} x2={chartWidth - padding.right} y2={y} 
                                          stroke="#e2e8f0" strokeWidth="1" strokeDasharray="4,4" />
                                    <text x={padding.left - 10} y={y + 4} textAnchor="end" fontSize="10" fill="#94a3b8">
                                        {value}
                                    </text>
                                </g>
                            );
                        })}
                        
                        {/* Lines and points */}
                        {lines.map((line, lineIdx) => {
                            const points = data.map((d, idx) => ({
                                x: scaleX(idx),
                                y: scaleY(d[line.key] || 0),
                                value: d[line.key] || 0
                            }));
                            
                            const pathData = points.map((p, i) => 
                                `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`
                            ).join(' ');
                            
                            return (
                                <g key={lineIdx}>
                                    {/* Line */}
                                    <path
                                        d={pathData}
                                        fill="none"
                                        stroke={colors[lineIdx]}
                                        strokeWidth="3"
                                        strokeLinecap="round"
                                        strokeLinejoin="round"
                                    />
                                    
                                    {/* Points */}
                                    {points.map((point, idx) => (
                                        <g key={idx}>
                                            <circle cx={point.x} cy={point.y} r="6" fill="white" stroke={colors[lineIdx]} strokeWidth="2" />
                                            <circle cx={point.x} cy={point.y} r="4" fill={colors[lineIdx]}>
                                                <title>{`${line.name}: ${point.value}`}</title>
                                            </circle>
                                        </g>
                                    ))}
                                </g>
                            );
                        })}
                        
                        {/* X axis labels */}
                        {data.map((d, idx) => (
                            <text key={idx} x={scaleX(idx)} y={chartHeight - padding.bottom + 20} 
                                  textAnchor="middle" fontSize="12" fill="#64748b" fontWeight="600">
                                {d.year}
                            </text>
                        ))}
                    </svg>
                    
                    {/* Legend */}
                    <div className="flex flex-wrap justify-center gap-4 mt-2">
                        {lines.map((line, idx) => (
                            <div key={idx} className="flex items-center gap-2">
                                <div className="w-4 h-1 rounded-full" style={{ backgroundColor: colors[idx] }} />
                                <span className="text-[10px] text-slate-600 font-medium">{line.name}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };
        
        // Gráfico de área con SVG mejorado
        const CSSAreaChart = ({ data, dataKey, color, yLabel }) => {
            const chartWidth = 800;
            const chartHeight = 300;
            const padding = { top: 20, right: 40, bottom: 60, left: 60 };
            const innerWidth = chartWidth - padding.left - padding.right;
            const innerHeight = chartHeight - padding.top - padding.bottom;
            
            const values = data.map(d => d[dataKey]);
            const minValue = Math.min(...values);
            const maxValue = Math.max(...values);
            const range = maxValue - minValue;
            
            const scaleY = (value) => {
                const normalized = (value - minValue) / range;
                return padding.top + innerHeight - (normalized * innerHeight);
            };
            
            const scaleX = (index) => {
                return padding.left + (index / (data.length - 1)) * innerWidth;
            };
            
            const points = data.map((d, idx) => ({
                x: scaleX(idx),
                y: scaleY(d[dataKey])
            }));
            
            const areaPath = [
                `M ${points[0].x} ${points[0].y}`,
                ...points.slice(1).map(p => `L ${p.x} ${p.y}`),
                `L ${points[points.length - 1].x} ${padding.top + innerHeight}`,
                `L ${points[0].x} ${padding.top + innerHeight}`,
                'Z'
            ].join(' ');
            
            const linePath = points.map((p, i) => 
                `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`
            ).join(' ');
            
            return (
                <div className="w-full h-full flex flex-col items-center justify-center">
                    <svg viewBox={`0 0 ${chartWidth} ${chartHeight}`} className="w-full h-full">
                        <defs>
                            <linearGradient id={`gradient-${dataKey}`} x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stopColor={color} stopOpacity="0.5" />
                                <stop offset="100%" stopColor={color} stopOpacity="0.05" />
                            </linearGradient>
                        </defs>
                        
                        {/* Grid lines */}
                        {[0, 1, 2, 3, 4].map(i => {
                            const y = padding.top + (innerHeight / 4) * i;
                            const value = (maxValue - (range / 4) * i).toFixed(1);
                            return (
                                <g key={i}>
                                    <line x1={padding.left} y1={y} x2={chartWidth - padding.right} y2={y} 
                                          stroke="#e2e8f0" strokeWidth="1" strokeDasharray="4,4" />
                                    <text x={padding.left - 10} y={y + 4} textAnchor="end" fontSize="10" fill="#94a3b8">
                                        {value}
                                    </text>
                                </g>
                            );
                        })}
                        
                        {/* Area */}
                        <path d={areaPath} fill={`url(#gradient-${dataKey})`} />
                        
                        {/* Line */}
                        <path d={linePath} fill="none" stroke={color} strokeWidth="2.5" />
                        
                        {/* X axis labels */}
                        {data.map((d, idx) => (
                            <text key={idx} x={scaleX(idx)} y={chartHeight - padding.bottom + 20} 
                                  textAnchor="middle" fontSize="12" fill="#64748b" fontWeight="600">
                                {d.year}
                            </text>
                        ))}
                        
                        {/* Y axis label */}
                        <text x={15} y={chartHeight / 2} textAnchor="middle" fontSize="11" fill="#64748b" 
                              transform={`rotate(-90, 15, ${chartHeight / 2})`} fontWeight="500">
                            {yLabel}
                        </text>
                    </svg>
                    
                    {/* Legend */}
                    <div className="flex justify-center mt-2">
                        <div className="flex items-center gap-2">
                            <div className="w-4 h-4 rounded" style={{ backgroundColor: color }} />
                            <span className="text-[10px] text-slate-600 font-medium">{yLabel}</span>
                        </div>
                    </div>
                </div>
            );
        };

        // --- CONSTANTS ---

            const [activeSection, setActiveSection] = useState(SectionType.INTRO);
            const containerRef = useRef(null);
            
            const handleSectionChange = (sec) => { setActiveSection(sec); if(containerRef.current) containerRef.current.scrollTop = 0; };
            
            useEffect(() => {
                const loader = document.getElementById('loading-screen');
                if (loader) loader.style.display = 'none';
                
                // Listener para cambios de sección desde los botones
                const handleSectionChangeEvent = (e) => {
                    handleSectionChange(e.detail);
                };
                window.addEventListener('changeSectionCRC', handleSectionChangeEvent);
                
                return () => {
                    window.removeEventListener('changeSectionCRC', handleSectionChangeEvent);
                };
            }, []);

            const activeSlides = slides.filter(slide => slide.section === activeSection);
            const currentIndex = SECTION_ORDER.indexOf(activeSection);
            const nextSectionTitle = currentIndex < SECTION_ORDER.length - 1 ? SECTION_ORDER[currentIndex + 1] : null;
            const progress = ((currentIndex + 1) / SECTION_ORDER.length) * 100;

            const handleNext = () => nextSectionTitle && handleSectionChange(nextSectionTitle);

            const Navigation = () => (
                <div className="fixed left-0 top-0 h-full w-20 bg-slate-900 flex flex-col items-center py-8 z-50 shadow-2xl border-r border-slate-800">
                    <div className="font-bold text-white text-xs mb-10 tracking-widest bg-indigo-600 px-2 py-1 rounded">CRC</div>
                    <nav className="flex-1 flex flex-col gap-8 w-full px-2">
                        {SECTION_ORDER.map((sec) => {
                            const isActive = activeSection === sec;
                            let IconC = Home;
                            if (sec === SectionType.TELECOM) IconC = Radio;
                            if (sec === SectionType.POSTAL) IconC = Mail;
                            if (sec === SectionType.AUDIOVISUAL) IconC = Video;
                            if (sec === SectionType.OUTRO) IconC = CheckCircle;
                            return (
                                <button key={sec} onClick={() => handleSectionChange(sec)} className={`flex flex-col items-center gap-1 p-3 rounded-2xl transition-all duration-300 w-full ${isActive ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`} title={sec}>
                                    <IconC size={24} strokeWidth={isActive ? 2.5 : 2} />
                                </button>
                            );
                        })}
                    </nav>
                    <div className="w-full px-4 flex flex-col items-center gap-2"><div className="text-[10px] text-slate-500 font-mono">{Math.round(progress)}%</div><div className="h-24 w-1.5 bg-slate-800 rounded-full overflow-hidden relative"><div className="absolute bottom-0 left-0 w-full bg-indigo-500 transition-all duration-500" style={{ height: `${progress}%` }} /></div></div>
                </div>
            );

            return (
                <div className="flex h-screen w-screen overflow-hidden bg-slate-50 text-slate-900 font-sans">
                    <Navigation />
                    <main ref={containerRef} className="flex-1 ml-20 h-full overflow-y-auto scroll-smooth">
                        <div className="flex flex-col w-full min-h-screen">
                            {activeSlides.map(slide => <div key={slide.id} id={slide.id} className="w-full web-section">{slide.component}</div>)}
                            <SectionNavigation onNext={handleNext} nextSectionTitle={nextSectionTitle} isLast={!nextSectionTitle} currentSection={activeSection} />
                            {activeSection === SectionType.OUTRO && <footer className="py-12 text-center text-slate-400 text-sm bg-slate-900">&copy; 2026 CRC</footer>}
                        </div>
                    </main>
                </div>
            );
        };

        updateLoadingStatus('Renderizando aplicación...');
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Ocultar pantalla de carga después de renderizar
        setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                loadingScreen.style.transition = 'opacity 0.5s';
                setTimeout(() => {

            }
        }, 1000);
        
        console.log('✅ Aplicación cargada correctamente');
    </script>
