<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRC Tendencias 2025 - Micrositio</title>
    
    <!-- 1. Estilos (Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 3. Librerías del Núcleo -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        overflow-y: hidden;
      }
      
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }

      .web-section {
          min-height: 80vh;
          padding: 4rem 2rem;
          border-bottom: 1px solid #e2e8f0;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "react/": "https://esm.sh/react@^19.2.1/",
    "lucide-react": "https://esm.sh/lucide-react@^0.559.0",
    "recharts": "https://esm.sh/recharts@^3.5.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { BarChart, Bar, LineChart, Line, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        // --- ICONOS ---
        const Icon = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Icons = {
            Home: (p) => <Icon {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>,
            Radio: (p) => <Icon {...p}><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></Icon>,
            Mail: (p) => <Icon {...p}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></Icon>,
            Video: (p) => <Icon {...p}><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></Icon>,
            CheckCircle: (p) => <Icon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>,
            Globe: (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10 15.3 15.3 0 0 1 4 10z"/></Icon>,
            Zap: (p) => <Icon {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Icon>,
            Tv: (p) => <Icon {...p}><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></Icon>,
            ChevronDown: (p) => <Icon {...p}><path d="m6 9 6 6 6-6"/></Icon>,
            ChevronUp: (p) => <Icon {...p}><path d="m18 15-6-6-6 6"/></Icon>,
            ArrowRight: (p) => <Icon {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>,
            ShieldCheck: (p) => <Icon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></Icon>,
            Cpu: (p) => <Icon {...p}><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></Icon>,
            Target: (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>,
            Users: (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>,
            CreditCard: (p) => <Icon {...p}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></Icon>,
            Lightbulb: (p) => <Icon {...p}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></Icon>,
            Lock: (p) => <Icon {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>,
            PieChart: (p) => <Icon {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></Icon>,
            Network: (p) => <Icon {...p}><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></Icon>,
            CheckCircle2: (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>,
            Truck: (p) => <Icon {...p}><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5"/><path d="M14 17h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></Icon>,
            Box: (p) => <Icon {...p}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></Icon>,
            Signal: (p) => <Icon {...p}><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 20V4"/></Icon>,
            Share2: (p) => <Icon {...p}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></Icon>,
            BarChart3: (p) => <Icon {...p}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></Icon>
        };

        const { Home, Radio, Mail, Video, CheckCircle, Globe, Zap, Tv, ChevronDown, ChevronUp, ArrowRight, ShieldCheck, Cpu, Target, Users, CreditCard, Lightbulb, Lock, PieChart, Network, CheckCircle2, Truck, Box, Signal, Share2, BarChart3 } = Icons;

        const SectionType = { INTRO: 'Introducción', TELECOM: 'Telecomunicaciones', POSTAL: 'Postal', AUDIOVISUAL: 'Audiovisual', OUTRO: 'Cierre' };
        const SECTION_ORDER = [SectionType.INTRO, SectionType.TELECOM, SectionType.POSTAL, SectionType.AUDIOVISUAL, SectionType.OUTRO];

        // --- COMPONENTES UI ---
        const SectionNavigation = ({ onNext, nextSectionTitle, isLast }) => {
            if (isLast) return null;
            return (
                <div className="w-full flex justify-center py-20 bg-slate-100/50">
                    <button onClick={onNext} className="group flex items-center gap-6 bg-slate-900 text-white pr-6 pl-10 py-5 rounded-full shadow-2xl hover:bg-indigo-600 transition-all duration-300 transform hover:-translate-y-1 hover:shadow-indigo-500/30 cursor-pointer">
                        <div className="text-right">
                            <div className="text-xs text-slate-400 font-bold uppercase tracking-widest group-hover:text-indigo-200 mb-1">Siguiente Capítulo</div>
                            <div className="text-2xl font-bold">{nextSectionTitle}</div>
                        </div>
                        <div className="bg-white/10 p-3 rounded-full group-hover:bg-white/20 transition-colors">
                            <ArrowRight size={28} />
                        </div>
                    </button>
                </div>
            );
        };

        const SlideLayout = ({ title, subtitle, children, chapter, isCover = false }) => {
            if (isCover) {
                return (
                    <section className="min-h-screen w-full flex flex-col items-center justify-center text-center bg-gradient-to-br from-indigo-900 via-blue-800 to-blue-600 text-white p-8 md:p-20 relative overflow-hidden animate-fade-in">
                        <div className="absolute top-0 left-0 w-full h-full overflow-hidden opacity-10 pointer-events-none">
                            <div className="absolute -top-24 -left-24 w-96 h-96 bg-white rounded-full blur-3xl"></div>
                            <div className="absolute top-1/2 right-0 w-64 h-64 bg-purple-500 rounded-full blur-3xl"></div>
                        </div>
                        <div className="max-w-6xl w-full z-10 flex flex-col items-center justify-center">
                            {children}
                        </div>
                    </section>
                );
            }
            return (
                <section className="w-full flex flex-col items-center bg-white border-b border-slate-100 py-24 px-6 md:px-12 lg:px-24">
                    <div className="w-full max-w-[1400px]">
                        <div className="mb-16">
                            {chapter && (
                                <div className="flex items-center gap-3 mb-5">
                                    <span className="h-1 w-10 bg-indigo-500 rounded-full"></span>
                                    <span className="text-indigo-600 text-sm font-bold tracking-widest uppercase">{chapter}</span>
                                </div>
                            )}
                            <div className="space-y-6 max-w-4xl">
                                {title && <h2 className="text-4xl md:text-5xl lg:text-6xl font-bold text-slate-900 leading-tight tracking-tight">{title}</h2>}
                                {subtitle && <p className="text-xl md:text-2xl text-slate-500 font-light leading-relaxed">{subtitle}</p>}
                            </div>
                        </div>
                        <div className="w-full">{children}</div>
                    </div>
                </section>
            );
        };

        const InteractiveMatrix = () => {
            const [activeSection, setActiveSection] = useState('overview');
            const [openAccordions, setOpenAccordions] = useState({});
            
            const toggleAccordion = (sectionId, itemId) => {
                const key = `${sectionId}-${itemId}`;
                setOpenAccordions(prev => ({ ...prev, [key]: !prev[key] }));
            };
            
            const NavButton = ({ id, label, icon: Icon }) => (
                <button onClick={() => setActiveSection(id)} className={`flex items-center gap-2 w-full p-3 rounded-lg text-sm font-medium transition-colors ${activeSection === id ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-600 hover:bg-slate-100'}`}>
                    <Icon size={18} />{label}
                </button>
            );

            const sectionContent = {
                comms: {
                    title: 'Tendencias en Comunicaciones',
                    items: [
                        { title: 'Tecnologías para uso eficiente, cobertura y calidad', details: [{ subtitle: 'Gestión Inteligente', text: '5G SA, NFV, SDN, Edge Computing' }, { subtitle: 'Acceso eficiente', text: 'NTN 5G, FTTx, HCF' }] },
                        { title: 'Modelos de negocio', details: [{ subtitle: 'Virtualización', text: '' }, { subtitle: 'Network Slicing', text: '' }, { subtitle: 'Redes Privadas', text: '' }] }
                    ]
                },
                postal: {
                    title: 'Tendencias Sector Postal',
                    items: [
                        { title: 'E-commerce', details: [{ subtitle: 'Plataformas digitales', text: 'Integración tecnológica' }] },
                        { title: 'Modelos híbridos', details: [{ subtitle: 'Interoperabilidad', text: '' }] }
                    ]
                },
                av: {
                    title: 'Tendencias Sector Audiovisual',
                    items: [
                        { title: 'Tecnologías de creación', details: [{ subtitle: 'Infraestructuras futuras', text: 'Unreal Engine, Omniverse' }] },
                        { title: 'Modelos de negocio', details: [{ subtitle: 'Plataformas', text: '' }] }
                    ]
                }
            };

            return (
                <div className="flex h-full gap-6">
                    <div className="w-64 hidden md:flex flex-col gap-2 border-r border-slate-200 pr-4">
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Navegación</h3>
                        <NavButton id="overview" label="Resumen General" icon={PieChart} />
                        <NavButton id="comms" label="Comunicaciones" icon={Network} />
                        <NavButton id="postal" label="Sector Postal" icon={Mail} />
                        <NavButton id="av" label="Sector Audiovisual" icon={Tv} />
                    </div>
                    <div className="flex-1 overflow-y-auto pr-2">
                        {activeSection === 'overview' && (
                            <div className="animate-fade-in">
                                <h3 className="text-2xl font-bold text-slate-800 mb-6">Resumen General del Estudio</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                    {[{ label: 'Problemáticas', val: '25' }, { label: 'Tendencias', val: '4' }, { label: 'Sectores', val: '3' }].map((stat) => (
                                        <div key={stat.label} className="bg-slate-50 p-6 rounded-xl border border-slate-200 text-center">
                                            <div className="text-3xl font-bold text-indigo-600 mb-1">{stat.val}</div>
                                            <div className="text-sm text-slate-500 font-medium">{stat.label}</div>
                                        </div>
                                    ))}
                                </div>
                                <h4 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><span className="bg-red-100 text-red-600 p-1 rounded">🚨</span> Problemáticas Críticas</h4>
                                <div className="space-y-2">
                                    {["Costos operativos elevados", "Barreras al despliegue", "Uso ineficiente de red", "Pérdida de mercado postal", "Concentración de contenidos"].map((prob, i) => (
                                        <div key={i} className="flex items-center gap-3 p-3 bg-red-50 border-l-4 border-red-500 rounded-r-lg text-slate-700 text-sm">{prob}</div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {activeSection !== 'overview' && (
                            <div className="animate-fade-in space-y-4">
                                <h3 className="text-2xl font-bold text-slate-800 mb-4">{sectionContent[activeSection].title}</h3>
                                {sectionContent[activeSection].items.map((item, idx) => {
                                    const isOpen = !!openAccordions[`${activeSection}-${idx}`];
                                    return (
                                        <div key={idx} className="border border-slate-200 rounded-xl overflow-hidden">
                                            <button onClick={() => toggleAccordion(activeSection, idx)} className="w-full flex justify-between items-center p-4 bg-slate-50 hover:bg-slate-100 font-bold text-slate-700 text-left">
                                                <span>{item.title}</span>
                                                {isOpen ? <ChevronUp size={20}/> : <ChevronDown size={20}/>}
                                            </button>
                                            {isOpen && (
                                                <div className="p-4 bg-white space-y-4">
                                                    {item.details.map((detail, dIdx) => (
                                                        <div key={dIdx} className="flex gap-4 items-start">
                                                            <CheckCircle2 className="text-green-500 mt-1 flex-shrink-0" size={20} />
                                                            <div>
                                                                <h5 className="font-bold text-slate-800">{detail.subtitle}</h5>
                                                                {detail.text && <p className="text-slate-600 text-sm">{detail.text}</p>}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- GRÁFICOS ---
        const TelecomAIChart = () => (
            <ResponsiveContainer width="100%" height={300}><BarChart data={[{year:'2023',d:20,i:300},{year:'2025',d:45,i:400},{year:'2027',d:75,i:520},{year:'2029',d:105,i:640},{year:'2031',d:140,i:730},{year:'2033',d:174,i:832}]} margin={{top:20,right:30,left:20,bottom:5}}><CartesianGrid strokeDasharray="3 3" vertical={false}/><XAxis dataKey="year"/><YAxis label={{value:'EB/mes',angle:-90,position:'insideLeft' }}/><Tooltip/><Legend/><Bar dataKey="d" name="Tráfico Directo IA" stackId="a" fill="#3b82f6"/><Bar dataKey="i" name="Tráfico Indirecto IA" stackId="a" fill="#86efac"/></BarChart></ResponsiveContainer>
        );
        const Telecom5GChart = () => (
            <ResponsiveContainer width="100%" height={300}><LineChart data={[{year:'2021',t:670,s:100},{year:'2023',t:1900,s:800},{year:'2025',t:3200,s:1700},{year:'2027',t:4500,s:2600},{year:'2029',t:5600,s:3300},{year:'2030',t:6300,s:3700}]}><CartesianGrid strokeDasharray="3 3" vertical={false}/><XAxis dataKey="year"/><YAxis/><Tooltip/><Legend/><Line type="monotone" dataKey="t" name="Suscripciones 5G Totales (M)" stroke="#1e40af" strokeWidth={3} dot={{r:4}}/><Line type="monotone" dataKey="s" name="5G Stand Alone (M)" stroke="#22c55e" strokeWidth={3} dot={{r:4}}/></LineChart></ResponsiveContainer>
        );
        const TelecomNTNChart = () => (
            <ResponsiveContainer width="100%" height={250}><AreaChart data={[{year:'2023',v:5.6},{year:'2024',v:5.67},{year:'2026',v:10.2},{year:'2028',v:20.5},{year:'2030',v:42.2}]}><CartesianGrid strokeDasharray="3 3" vertical={false}/><XAxis dataKey="year"/><YAxis label={{value:'$ Billion',angle:-90,position:'insideLeft' }}/><Tooltip/><Area type="monotone" dataKey="v" name="Mercado 5G NTN ($B)" stroke="#8884d8" fill="#8884d8" fillOpacity={0.3}/></AreaChart></ResponsiveContainer>
        );
        const PostalAutomationChart = () => (
            <ResponsiveContainer width="100%" height={300}><BarChart data={[{ year: '2024', val: 974 }, { year: '2026', val: 1150 }, { year: '2028', val: 1330 }, { year: '2030', val: 1510 }, { year: '2032', val: 1686 }]}><CartesianGrid strokeDasharray="3 3" vertical={false} /><XAxis dataKey="year" /><YAxis /><Tooltip /><Bar dataKey="val" name="Mercado Automatización ($M)" fill="#3b82f6" radius={[4, 4, 0, 0]} /></BarChart></ResponsiveContainer>
        );
        const PostalEcommerceUserChart = () => (
            <ResponsiveContainer width="100%" height={300}><AreaChart data={[{ year: '2019', val: 2.11 }, { year: '2021', val: 2.71 }, { year: '2023', val: 3.09 }, { year: '2025', val: 3.29 }, { year: '2027', val: 3.49 }, { year: '2029', val: 3.59 }]}><CartesianGrid strokeDasharray="3 3" vertical={false} /><XAxis dataKey="year" /><YAxis /><Tooltip /><Area type="monotone" dataKey="val" name="Usuarios E-commerce (Billions)" stroke="#f59e0b" fill="#fcd34d" /></AreaChart></ResponsiveContainer>
        );
        const AVVideoTrafficChart = () => (
            <ResponsiveContainer width="100%" height={300}><LineChart data={[{ year: '2020', val: 50 }, { year: '2021', val: 53 }, { year: '2022', val: 57 }, { year: '2023', val: 60 }, { year: '2024', val: 74 }, { year: '2025', val: 77 }, { year: '2026', val: 80 }]}><CartesianGrid strokeDasharray="3 3" vertical={false} /><XAxis dataKey="year" /><YAxis domain={[0, 100]} label={{ value: '%', angle: -90, position: 'insideLeft' }}/><Tooltip /><Line type="monotone" dataKey="val" name="% Tráfico de Video Móvil" stroke="#ef4444" strokeWidth={3} /></LineChart></ResponsiveContainer>
        );
        const AVEnergyChart = () => (
            <ResponsiveContainer width="100%" height={300}><BarChart data={[{ year: '2022', val: 460 }, { year: '2023', val: 550 }, { year: '2024', val: 650 }, { year: '2025', val: 800 }, { year: '2026', val: 1000 }]}><CartesianGrid strokeDasharray="3 3" vertical={false} /><XAxis dataKey="year" /><YAxis label={{ value: 'TWh', angle: -90, position: 'insideLeft' }}/><Tooltip /><Bar dataKey="val" name="Consumo Data Centers (TWh)" fill="#f87171" radius={[4, 4, 0, 0]} /></BarChart></ResponsiveContainer>
        );

        // --- DEFINICIÓN DE SLIDES ---
        const slides = [
            // INTRO
            {
                id: 'intro-cover',
                section: SectionType.INTRO,
                component: (
                    <SlideLayout isCover>
                        <h1 className="text-5xl md:text-8xl font-bold mb-8 leading-tight">MONITOREO DE TENDENCIAS TECNOLÓGICAS 2025</h1>
                        <div className="h-1 w-32 bg-white/30 mx-auto mb-8 rounded-full"></div>
                        <p className="text-xl md:text-2xl text-white/90 font-light mb-2">Coordinación de Prospectiva Estratégica e Innovación</p>
                        <p className="text-lg text-white/70 uppercase tracking-widest">Diciembre de 2025</p>
                        <div className="mt-12 bg-white/10 p-4 rounded-xl backdrop-blur-sm border border-white/20 shadow-2xl">
                            <img src="logo.png" alt="Logo CRC" className="h-24 md:h-32 object-contain mx-auto" />
                        </div>
                    </SlideLayout>
                )
            },
            {
                id: 'intro-obj',
                section: SectionType.INTRO,
                component: (
                    <SlideLayout title="Monitoreo de Tendencias Tecnológicas" chapter="Introducción" subtitle="Un enfoque estratégico para anticipar el futuro regulatorio.">
                        <div className="bg-gradient-to-r from-indigo-50 to-blue-50 p-8 rounded-2xl border-l-8 border-indigo-500 mb-12 shadow-sm">
                            <p className="text-xl text-slate-700 leading-relaxed"><strong>Objetivo:</strong> Identificar y analizar las principales tendencias tecnológicas que impactan los sectores de telecomunicaciones, postal y contenidos.</p>
                        </div>
                        <div className="grid md:grid-cols-2 gap-10">
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">

                                    <div className="bg-green-100 text-green-700 w-8 h-8 rounded-full flex items-center justify-center font-bold">3</div>
                                    <h4 className="font-bold text-green-900 text-lg">Convergencia (LatAm)</h4>
                                </div>
                                <p className="text-xs uppercase font-bold text-slate-400 mb-2">Acuerdos Operadores + Medios</p>
                                <ul className="text-sm text-slate-600 space-y-2">
                                    <li>• Paquetes SVoD/BVoD con publicidad en ofertas móviles/TV.</li>
                                    <li>• Radiodifusores despliegan BVoD/FAST propios.</li>
                                    <li>• Mercados clave: Brasil, México, Chile y R. Dominicana.</li>
                                </ul>
                            </div>

                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg transition-all">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="bg-blue-100 text-blue-700 w-8 h-8 rounded-full flex items-center justify-center font-bold">4</div>
                                    <h4 className="font-bold text-blue-900 text-lg">Monetización y Datos</h4>
                                </div>
                                <ul className="text-sm text-slate-600 space-y-2">
                                    <li>• Publicidad segmentada con cobro conjunto (Carrier Billing).</li>
                                    <li>• Uso intensivo de analítica y recomendación para retención.</li>
                                    <li>• Tensiones entre personalización y transparencia algorítmica.</li>
                                </ul>
                            </div>

                            <div className="md:col-span-2 bg-amber-50 p-6 rounded-2xl border-l-4 border-amber-500 shadow-sm hover:shadow-lg transition-all">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="bg-amber-200 text-amber-800 w-8 h-8 rounded-full flex items-center justify-center font-bold">5</div>
                                    <h4 className="font-bold text-amber-900 text-lg">Reconfiguración del poder en el mercado publicitario</h4>
                                </div>
                                <div className="grid md:grid-cols-2 gap-4">
                                    <ul className="text-sm text-slate-700 space-y-2">
                                        <li>• Nuevas relaciones entre plataformas globales, programadores y anunciantes.</li>
                                        <li>• Concentración del inventario publicitario en pocos intermediarios.</li>
                                    </ul>
                                    <ul className="text-sm text-slate-700 space-y-2">
                                        <li>• Riesgos de barreras para medios locales e independientes.</li>
                                        <li>• Necesidad de reglas claras sobre transparencia y reparto de ingresos.</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div className="text-[10px] text-slate-400 mt-6">
                            Fuentes: Ofcom, Media Nations / Online Nation 2025; GSMA, Consumers in Focus 2024–2025; GSMA 5G LatAm (2025); informes sectoriales sobre BVoD/FAST.
                        </div>
                    </SlideLayout>
                )
            },
            {
                id: 'av-strategies',
                section: SectionType.AUDIOVISUAL,
                component: (
                    <SlideLayout 
                        title="Acciones estratégicas para orientar la transformación del ecosistema audiovisual"
                        chapter="Audiovisual"
                        subtitle="Del diagnóstico de tendencias a una agenda de acción en tecnología, modelos de negocio, protección de audiencias y sostenibilidad impulsada por los distintos actores del ecosistema."
                    >
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6 h-full overflow-y-auto pb-10">
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg transition-all">
                                <BarChart3 className="text-blue-500 mb-4" size={32} />
                                <h4 className="font-bold text-slate-900 text-lg mb-2">Monitoreo y prospectiva regulatoria</h4>
                                <p className="text-sm text-slate-600 leading-relaxed">
                                    Consolidar sistemas de información que integren consumo, modelos de negocio, tráfico de redes y sostenibilidad. Desarrollar escenarios y hojas de ruta tecnológicas (IA, 5G Broadcast, cloud–edge–device).
                                </p>
                            </div>

                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg transition-all">
                                <Cpu className="text-purple-500 mb-4" size={32} />
                                <h4 className="font-bold text-slate-900 text-lg mb-2">Capacidades técnicas y auditoría</h4>
                                <p className="text-sm text-slate-600 leading-relaxed">
                                    Reforzar equipos en datos, QoE de video y auditoría algorítmica (C2PA, SMPTE, ETSI). Evaluar impacto de recomendaciones en pluralismo, competencia y protección de NNA.
                                </p>
                            </div>

                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg transition-all">
                                <ShieldCheck className="text-green-500 mb-4" size={32} />
                                <h4 className="font-bold text-slate-900 text-lg mb-2">Co-regulación y prácticas</h4>
                                <p className="text-sm text-slate-600 leading-relaxed">
                                    Impulsar códigos de conducta y acuerdos voluntarios (transparencia algorítmica, violencia de género, salud mental), manteniendo supervisión editorial humana frente a la IA.
                                </p>
                            </div>

                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg transition-all">
                                <Users className="text-amber-500 mb-4" size={32} />
                                <h4 className="font-bold text-slate-900 text-lg mb-2">Agenda pública y alfabetización</h4>
                                <p className="text-sm text-slate-600 leading-relaxed">
                                    Integrar AMI con foco audiovisual en políticas educativas. Traducir marcos como la Ley 2489 de 2025 en pautas de uso seguro. Incorporar métricas de huella de carbono en licencias.
                                </p>
                            </div>

                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg transition-all lg:col-span-2">
                                <div className="flex gap-4">
                                    <Globe className="text-indigo-500 shrink-0" size={32} />
                                    <div>
                                        <h4 className="font-bold text-slate-900 text-lg mb-2">Cooperación y observatorio regional</h4>
                                        <p className="text-sm text-slate-600 leading-relaxed">
                                            Participar en un observatorio latinoamericano de marcos regulatorios y prácticas no estatutarias sobre plataformas, IA y sostenibilidad, para compartir evidencia y fortalecer una voz regional coordinada.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="text-[10px] text-slate-400 mt-6">
                            Referencias: UNESCO–OBSERVACOM (prácticas no estatutarias); European Commission / EU (EMFA, DSA, DMA, CSRD, EED); IEA (2024); GSMA / Ericsson (tráfico de video y 5G); Ley 2489 de 2025.
                        </div>
                    </SlideLayout>
                )
            },

            { id: 'outro', section: SectionType.OUTRO, component: <SlideLayout isCover><h1 className="text-6xl font-bold mb-4">¡Gracias!</h1><p className="text-xl text-white/90">Comisión de Regulación de Comunicaciones</p></SlideLayout> }
        ];

        // --- APP PRINCIPAL ---
        const App = () => {
            const [activeSection, setActiveSection] = useState(SectionType.INTRO);
            const containerRef = useRef(null);
            const activeSlides = slides.filter(slide => slide.section === activeSection);
            const currentIndex = SECTION_ORDER.indexOf(activeSection);
            const nextSectionTitle = currentIndex < SECTION_ORDER.length - 1 ? SECTION_ORDER[currentIndex + 1] : null;
            const progress = ((currentIndex + 1) / SECTION_ORDER.length) * 100;

            const handleSectionChange = (sec) => { setActiveSection(sec); if(containerRef.current) containerRef.current.scrollTop = 0; };
            const handleNext = () => nextSectionTitle && handleSectionChange(nextSectionTitle);

            const Navigation = () => (
                <div className="fixed left-0 top-0 h-full w-20 bg-slate-900 flex flex-col items-center py-8 z-50 shadow-2xl border-r border-slate-800">
                    <div className="font-bold text-white text-xs mb-10 tracking-widest bg-indigo-600 px-2 py-1 rounded">CRC</div>
                    <nav className="flex-1 flex flex-col gap-8 w-full px-2">
                        {SECTION_ORDER.map((sec) => {
                            const isActive = activeSection === sec;
                            let IconC = Home;
                            if (sec === SectionType.TELECOM) IconC = Radio;
                            if (sec === SectionType.POSTAL) IconC = Mail;
                            if (sec === SectionType.AUDIOVISUAL) IconC = Video;
                            if (sec === SectionType.OUTRO) IconC = CheckCircle;
                            return (
                                <button key={sec} onClick={() => handleSectionChange(sec)} className={`flex flex-col items-center gap-1 p-3 rounded-2xl transition-all duration-300 w-full ${isActive ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`} title={sec}>
                                    <IconC size={24} strokeWidth={isActive ? 2.5 : 2} />
                                </button>
                            );
                        })}
                    </nav>
                    <div className="w-full px-4 flex flex-col items-center gap-2"><div className="text-[10px] text-slate-500 font-mono">{Math.round(progress)}%</div><div className="h-24 w-1.5 bg-slate-800 rounded-full overflow-hidden relative"><div className="absolute bottom-0 left-0 w-full bg-indigo-500 transition-all duration-500" style={{ height: `${progress}%` }} /></div></div>
                </div>
            );

            return (
                <div className="flex h-screen w-screen overflow-hidden bg-slate-50 text-slate-900 font-sans">
                    <Navigation />
                    <main ref={containerRef} className="flex-1 ml-20 h-full overflow-y-auto scroll-smooth">
                        <div className="flex flex-col w-full min-h-screen">
                            {activeSlides.map(slide => <div key={slide.id} className="w-full web-section">{slide.component}</div>)}
                            <SectionNavigation onNext={handleNext} nextSectionTitle={nextSectionTitle} isLast={!nextSectionTitle} />
                            {activeSection === SectionType.OUTRO && <footer className="py-12 text-center text-slate-400 text-sm bg-slate-900">&copy; 2025 CRC</footer>}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
