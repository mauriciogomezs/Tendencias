
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRC Tendencias 2025</title>
    
    <!-- 1. Estilos (Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- 3. Librerías del Núcleo (Orden Crítico) -->
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Prop-Types (Requerido por Recharts en modo UMD) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    
    <!-- Recharts (Gráficos) -->
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
    
    <!-- Babel (Compilador JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        padding: 0;
        overflow: hidden; 
      }
      
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
      
      .snap-container {
        scroll-snap-type: y mandatory;
        overflow-y: scroll;
        height: 100vh;
        scroll-behavior: smooth;
      }
      .snap-child {
        scroll-snap-align: start;
        height: 100vh;
        width: 100%;
        position: relative;
      }

      #error-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: white;
        z-index: 9999;
        padding: 2rem;
        color: red;
        border: 5px solid red;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <div id="error-overlay"></div>

    <script>
      // Manejador de errores básico
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Error global:", message, error);
        const overlay = document.getElementById('error-overlay');
        overlay.style.display = 'block';
        overlay.innerHTML = `
            <h2 style="font-size:24px; font-weight:bold; margin-bottom:10px;">Ocurrió un error al cargar</h2>
            <p><strong>Mensaje:</strong> ${message}</p>
            <p><strong>Línea:</strong> ${lineno}</p>
            <p style="margin-top:20px; color:black;">Intenta recargar la página o revisa la consola (F12).</p>
        `;
      };
    </script>

    <script type="text/babel">
        // --- VALIDACIÓN DE DEPENDENCIAS ---
        if (!window.React || !window.ReactDOM || !window.Recharts) {
            throw new Error("Las librerías externas (React o Recharts) no se cargaron correctamente. Revisa tu conexión a internet.");
        }

        const { useState, useEffect, useRef } = React;
        
        // Extraer componentes de Recharts de manera segura
        const { 
            BarChart, Bar, LineChart, Line, AreaChart, Area, 
            XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer 
        } = window.Recharts;

        // --- ICONOS SVG ---
        const Icon = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        // Definición del Mapa de Iconos (Objeto Global)
        const Icons = {
            Home: (props) => <Icon {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>,
            Radio: (props) => <Icon {...props}><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></Icon>,
            Mail: (props) => <Icon {...props}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></Icon>,
            Video: (props) => <Icon {...props}><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></Icon>,
            CheckCircle: (props) => <Icon {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>,
            Globe: (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10 15.3 15.3 0 0 1 4 10z"/></Icon>,
            Zap: (props) => <Icon {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Icon>,
            Tv: (props) => <Icon {...props}><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></Icon>,
            ChevronRight: (props) => <Icon {...props}><path d="m9 18 6-6-6-6"/></Icon>,
            ChevronDown: (props) => <Icon {...props}><path d="m6 9 6 6 6-6"/></Icon>,
            ChevronUp: (props) => <Icon {...props}><path d="m18 15-6-6-6 6"/></Icon>,
            ArrowRight: (props) => <Icon {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>,
            ShieldCheck: (props) => <Icon {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></Icon>,
            Cpu: (props) => <Icon {...props}><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></Icon>,
            Target: (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>,
            Users: (props) => <Icon {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>,
            CreditCard: (props) => <Icon {...props}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></Icon>,
            Lightbulb: (props) => <Icon {...props}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></Icon>,
            Lock: (props) => <Icon {...props}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>,
            PieChart: (props) => <Icon {...props}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></Icon>,
            Network: (props) => <Icon {...props}><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></Icon>,
            CheckCircle2: (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>,
            Truck: (props) => <Icon {...props}><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5"/><path d="M14 17h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></Icon>,
            Box: (props) => <Icon {...props}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></Icon>,
            Building: (props) => <Icon {...props}><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></Icon>
        };

        // Desestructurar para uso global en JSX
        const { 
            Home, Radio, Mail, Video, CheckCircle, Globe, Zap, Tv, 
            ChevronRight, ChevronDown, ChevronUp, ArrowRight, ShieldCheck, 
            Cpu, Target, Users, CreditCard, Lightbulb, Lock, PieChart, 
            Network, CheckCircle2, Truck, Box, Building 
        } = Icons;

        // --- CONSTANTES ---
        const SectionType = {
            INTRO: 'Introducción',
            TELECOM: 'Telecomunicaciones',
            POSTAL: 'Postal',
            AUDIOVISUAL: 'Audiovisual',
            OUTRO: 'Cierre'
        };

        const SECTION_ORDER = [
            SectionType.INTRO,
            SectionType.TELECOM,
            SectionType.POSTAL,
            SectionType.AUDIOVISUAL,
            SectionType.OUTRO
        ];

        // --- COMPONENTES UI ---

        const InternalNavigation = ({ prevId, nextId }) => {
            const scrollTo = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            if (!prevId && !nextId) return null;

            return (
                <div className="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-50 flex items-center gap-3 p-1.5 bg-white/80 backdrop-blur-md border border-slate-200/50 rounded-full shadow-lg transition-opacity duration-300 hover:bg-white">
                    <button 
                        onClick={() => prevId && scrollTo(prevId)}
                        disabled={!prevId}
                        className={`p-2 rounded-full transition-all duration-200 ${
                            prevId 
                                ? 'text-slate-700 hover:bg-indigo-100 hover:text-indigo-600 cursor-pointer' 
                                : 'text-slate-300 cursor-not-allowed'
                        }`}
                        title="Anterior"
                    >
                        <ChevronUp size={24} />
                    </button>
                    <div className="h-4 w-px bg-slate-300 mx-1"></div>
                    <button 
                        onClick={() => nextId && scrollTo(nextId)}
                        disabled={!nextId}
                        className={`p-2 rounded-full transition-all duration-200 ${
                            nextId 
                                ? 'text-slate-700 hover:bg-indigo-100 hover:text-indigo-600 cursor-pointer' 
                                : 'text-slate-300 cursor-not-allowed'
                        }`}
                        title="Siguiente"
                    >
                        <ChevronDown size={24} />
                    </button>
                </div>
            );
        };

        const SectionNavigation = ({ onNext, nextSectionTitle, isLast }) => {
            if (isLast) return null;
            return (
                <div className="flex flex-col items-center justify-center h-full w-full">
                    <div className="text-center mb-8">
                        <h3 className="text-3xl text-slate-700 font-light">Sección Completada</h3>
                    </div>
                    <button 
                        onClick={onNext}
                        className="group flex items-center gap-6 bg-slate-900 text-white pr-6 pl-8 py-5 rounded-full shadow-2xl hover:bg-indigo-600 transition-all duration-300 transform hover:-translate-y-1 hover:shadow-indigo-500/30 cursor-pointer"
                    >
                        <div className="text-right">
                            <div className="text-xs text-slate-400 font-bold uppercase tracking-widest group-hover:text-indigo-200">Siguiente</div>
                            <div className="text-2xl font-bold">{nextSectionTitle}</div>
                        </div>
                        <div className="bg-white/10 p-3 rounded-full group-hover:bg-white/20 transition-colors">
                            <ArrowRight size={32} />
                        </div>
                    </button>
                </div>
            );
        };

        const SlideLayout = ({ title, subtitle, children, chapter, isCover = false }) => {
            if (isCover) {
                return (
                    <section className="h-full w-full max-w-[1600px] flex flex-col items-center justify-center text-center bg-gradient-to-br from-indigo-900 via-blue-800 to-blue-600 text-white p-8 md:p-12 rounded-none md:rounded-3xl shadow-none md:shadow-2xl relative overflow-hidden animate-fade-in mx-auto">
                        <div className="absolute top-0 left-0 w-full h-full overflow-hidden opacity-10 pointer-events-none">
                            <div className="absolute -top-24 -left-24 w-96 h-96 bg-white rounded-full blur-3xl"></div>
                            <div className="absolute top-1/2 right-0 w-64 h-64 bg-purple-500 rounded-full blur-3xl"></div>
                        </div>
                        <div className="w-full z-10 flex flex-col items-center justify-center h-full">
                            {children}
                        </div>
                    </section>
                );
            }
            return (
                <section className="w-full h-full max-h-[90vh] max-w-[1400px] flex flex-col bg-white p-6 md:p-10 rounded-none md:rounded-3xl shadow-none md:shadow-xl border-x-0 md:border border-slate-200/60 mx-auto transition-all relative overflow-hidden">
                    <div className="flex flex-col md:flex-row justify-between items-start mb-4 border-b border-slate-100 pb-4 flex-shrink-0">
                        <div className="max-w-5xl">
                            {chapter && (
                                <span className="text-indigo-600 text-[10px] md:text-xs font-bold tracking-widest uppercase mb-2 block bg-indigo-50 px-3 py-1 rounded-full w-fit">
                                    {chapter}
                                </span>
                            )}
                            {title && <h2 className="text-2xl md:text-3xl lg:text-4xl font-bold text-slate-900 leading-tight">{title}</h2>}
                            {subtitle && <h3 className="text-base md:text-lg text-slate-500 font-medium mt-1">{subtitle}</h3>}
                        </div>
                        <div className="hidden md:block mt-2">
                            <div className="h-3 w-3 rounded-full bg-indigo-500 shadow-sm shadow-indigo-200"></div>
                        </div>
                    </div>
                    <div className="flex-1 w-full overflow-y-auto custom-scrollbar pr-2 pb-16">
                        {children}
                    </div>
                </section>
            );
        };

        // --- CHARTS ---
        const TelecomAIChart = () => {
            const data = [
                { year: '2023', direct: 20, indirect: 300 },
                { year: '2025', direct: 45, indirect: 400 },
                { year: '2027', direct: 75, indirect: 520 },
                { year: '2029', direct: 105, indirect: 640 },
                { year: '2031', direct: 140, indirect: 730 },
                { year: '2033', direct: 174, indirect: 832 },
            ];
            return (
                <ResponsiveContainer width="100%" height="100%">
                <BarChart data={data} margin={{ top: 20, right: 30, left: 20, bottom: 5 }}>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                    <XAxis dataKey="year" stroke="#64748b" />
                    <YAxis stroke="#64748b" label={{ value: 'EB/mes', angle: -90, position: 'insideLeft', fill: '#64748b' }} />
                    <Tooltip cursor={{ fill: '#f1f5f9' }} />
                    <Legend />
                    <Bar dataKey="direct" name="Tráfico Directo IA" stackId="a" fill="#3b82f6" />
                    <Bar dataKey="indirect" name="Tráfico Indirecto IA" stackId="a" fill="#86efac" />
                </BarChart>
                </ResponsiveContainer>
            );
        };
        
        const Telecom5GChart = () => {
            const data = [
                { year: '2021', total: 670, sa: 100 },
                { year: '2023', total: 1900, sa: 800 },
                { year: '2025', total: 3200, sa: 1700 },
                { year: '2027', total: 4500, sa: 2600 },
                { year: '2029', total: 5600, sa: 3300 },
                { year: '2030', total: 6300, sa: 3700 },
            ];
            return (
                <ResponsiveContainer width="100%" height="100%">
                <LineChart data={data}>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                    <XAxis dataKey="year" stroke="#64748b" />
                    <YAxis stroke="#64748b" />
                    <Tooltip />
                    <Legend />
                    <Line type="monotone" dataKey="total" name="Suscripciones 5G Totales (M)" stroke="#1e40af" strokeWidth={3} dot={{r: 4}} />
                    <Line type="monotone" dataKey="sa" name="5G Stand Alone (M)" stroke="#22c55e" strokeWidth={3} dot={{r: 4}} />
                </LineChart>
                </ResponsiveContainer>
            );
        };

        const TelecomNTNChart = () => {
            const data = [
                { year: '2023', val: 5.6 },
                { year: '2024', val: 5.67 },
                { year: '2026', val: 10.2 },
                { year: '2028', val: 20.5 },
                { year: '2030', val: 42.2 },
            ];
            return (
                <ResponsiveContainer width="100%" height="100%">
                <AreaChart data={data}>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} />
                    <XAxis dataKey="year" />
                    <YAxis label={{ value: '$ Billion', angle: -90, position: 'insideLeft' }} />
                    <Tooltip />
                    <Area type="monotone" dataKey="val" name="Mercado 5G NTN ($B)" stroke="#8884d8" fill="#8884d8" fillOpacity={0.3} />
                </AreaChart>
                </ResponsiveContainer>
            );
        };

        const PostalAutomationChart = () => {
            const data = [
                { year: '2024', val: 974 },
                { year: '2026', val: 1150 },
                { year: '2028', val: 1330 },
                { year: '2030', val: 1510 },
                { year: '2032', val: 1686 },
            ];
            return (
                <ResponsiveContainer width="100%" height="100%">
                <BarChart data={data}>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} />
                    <XAxis dataKey="year" />
                    <YAxis />
                    <Tooltip />
                    <Bar dataKey="val" name="Mercado Automatización ($M)" fill="#3b82f6" radius={[4, 4, 0, 0]} />
                </BarChart>
                </ResponsiveContainer>
            );
        };

        const PostalEcommerceUserChart = () => {
            const data = [
                { year: '2019', val: 2.11 },
                { year: '2021', val: 2.71 },
                { year: '2023', val: 3.09 },
                { year: '2025', val: 3.29 },
                { year: '2027', val: 3.49 },
                { year: '2029', val: 3.59 },
            ];
            return (
                <ResponsiveContainer width="100%" height="100%">
                <AreaChart data={data}>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} />
                    <XAxis dataKey="year" />
                    <YAxis />
                    <Tooltip />
                    <Area type="monotone" dataKey="val" name="Usuarios E-commerce (Billions)" stroke="#f59e0b" fill="#fcd34d" />
                </AreaChart>
                </ResponsiveContainer>
            );
        };

        const AVVideoTrafficChart = () => {
            const data = [
                { year: '2020', val: 50 },
                { year: '2021', val: 53 },
                { year: '2022', val: 57 },
                { year: '2023', val: 60 },
                { year: '2024', val: 74 },
                { year: '2025', val: 77 },
                { year: '2026', val: 80 },
            ];
            return (
                <ResponsiveContainer width="100%" height="100%">
                    <LineChart data={data}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                        <XAxis dataKey="year" />
                        <YAxis domain={[0, 100]} label={{ value: '%', angle: -90, position: 'insideLeft' }}/>
                        <Tooltip />
                        <Line type="monotone" dataKey="val" name="% Tráfico de Video Móvil" stroke="#ef4444" strokeWidth={3} />
                    </LineChart>
                </ResponsiveContainer>
            );
        };

        const AVEnergyChart = () => {
            const data = [
                { year: '2022', val: 460 },
                { year: '2023', val: 550 },
                { year: '2024', val: 650 },
                { year: '2025', val: 800 },
                { year: '2026', val: 1000 },
            ];
            return (
                <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={data}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                        <XAxis dataKey="year" />
                        <YAxis label={{ value: 'TWh', angle: -90, position: 'insideLeft' }}/>
                        <Tooltip />
                        <Bar dataKey="val" name="Consumo Data Centers (TWh)" fill="#f87171" radius={[4, 4, 0, 0]} />
                    </BarChart>
                </ResponsiveContainer>
            );
        };

        const InteractiveProblematicas = () => {
            const [activeTab, setActiveTab] = useState('general');
            const menuItems = [
                { id: 'general', label: 'General', count: 5, icon: Globe, color: 'text-green-600', bg: 'bg-green-50' },
                { id: 'telecom', label: 'Telecomunicaciones', count: 12, icon: Radio, color: 'text-blue-600', bg: 'bg-blue-50' },
                { id: 'postal', label: 'Postales', count: 3, icon: Mail, color: 'text-amber-600', bg: 'bg-amber-50' },
                { id: 'contenidos', label: 'Contenidos', count: 5, icon: Tv, color: 'text-red-600', bg: 'bg-red-50' },
            ];
            const content = {
                general: ["Cargas y necesidad de simplificación regulatoria", "Innovación en mecanismos regulatorios + Celeridad en medidas", "Coordinación interinstitucional", "Acceso y confiabilidad de información reportada", "Participación del sector en proyectos"],
                telecom: ["Falta de uso eficiente de recursos de red (infraestructura saturada)", "Saturación de red por demanda de contenidos", "Gestión de Espectro y Recursos", "Aumento de costos e inversión por cambios en calidad", "Preocupación por cambios en tarifas techo", "Dificultades para licencias de espectro (ANE)", "Falta de transparencia en cálculo de Contrapartidas", "Falta de armonización ANE - CRC", "Concentración de tráfico en redes internacionales", "Concentración de poder de mercado"],
                postal: ["Pérdida de rentabilidad por operación no regulada", "Pérdida de mercado frente a billeteras digitales", "Dificultades para modelos híbridos (servicios financieros)"],

                                    <BarChart data={[{ year: '2022', val: 460 }, { year: '2023', val: 550 }, { year: '2024', val: 650 }, { year: '2025', val: 800 }, { year: '2026', val: 1000 }]}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="year" />
                                        <YAxis label={{ value: 'TWh', angle: -90, position: 'insideLeft' }}/>
                                        <Tooltip />
                                        <Bar dataKey="val" name="Consumo Data Centers (TWh)" fill="#f87171" radius={[4, 4, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                            <div className="w-full md:w-1/3 flex flex-col justify-center space-y-6">
                                <div className="bg-green-50 p-6 rounded-xl border border-green-100"><h4 className="font-bold text-green-800 text-xl mb-1">20-50%</h4><p className="text-sm text-green-700">Reducción de emisiones gracias a la <strong>Producción Virtual</strong> (menos desplazamientos).</p></div>
                                <div className="bg-red-50 p-6 rounded-xl border border-red-100"><h4 className="font-bold text-red-800 text-xl mb-1">1,000 TWh</h4><p className="text-sm text-red-700">Consumo proyectado de Data Centers para 2026. Requiere métricas verificables (CSRD).</p></div>
                            </div>
                        </div>
                    </SlideLayout>
                )
            },
            {
                id: 'av-regulation',
                section: SectionType.AUDIOVISUAL,
                component: (
                    <SlideLayout title="Nuevo Paradigma Regulatorio" chapter="Audiovisual">
                        <div className="grid gap-6">
                            {[
                                { title: "EMFA (European Media Freedom Act)", desc: "Protección de independencia de medios y pluralismo.", icon: ShieldCheck },
                                { title: "DSA (Digital Services Act)", desc: "Transparencia algorítmica y protección de menores.", icon: Lock },
                                { title: "Sostenibilidad (CSRD)", desc: "Métricas ambientales obligatorias para streaming y data centers.", icon: Globe },
                            ].map((reg, i) => (
                                <div key={i} className="flex items-start gap-4 bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                    <div className="bg-indigo-50 p-3 rounded-lg text-indigo-600"><reg.icon size={24} /></div>
                                    <div><h4 className="font-bold text-lg text-slate-800">{reg.title}</h4><p className="text-slate-600">{reg.desc}</p></div>
                                </div>
                            ))}
                        </div>
                    </SlideLayout>
                )
            },
            {
                id: 'av-business-models',
                section: SectionType.AUDIOVISUAL,
                component: (
                    <SlideLayout title="Modelos de Negocio" chapter="Sector Audiovisual">
                        <div className="grid md:grid-cols-2 gap-6 h-full overflow-y-auto pb-20">
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                                <h4 className="font-bold text-indigo-700 mb-2 flex items-center gap-2 text-sm"><CreditCard size={18}/> Hibridación de modelos de pago</h4>
                                <p className="text-xs text-slate-600">Paso de esquemas solo suscripción a modelos mixtos: SVoD con ad-tiers, BVoD e ingresos contextuales (pause-to-shop, eventos inmersivos).</p>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                                <h4 className="font-bold text-pink-700 mb-2 flex items-center gap-2 text-sm"><Tv size={18}/> Publicidad integrada y experiencias inmersivas</h4>
                                <p className="text-xs text-slate-600">Crecen canales FAST, product placement avanzado, branded content en video corto y formatos de live commerce.</p>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                                <h4 className="font-bold text-green-700 mb-2 flex items-center gap-2 text-sm"><Network size={18}/> Convergencia (LatAm)</h4>
                                <p className="text-xs text-slate-600">Paquetes que integran SVoD con publicidad, OTT de radiodifusores que exploran BVoD/FAST y despliegue de ad-tiers en Brasil y México.</p>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                                <h4 className="font-bold text-blue-700 mb-2 flex items-center gap-2 text-sm"><Zap size={18}/> Monetización y Datos</h4>
                                <p className="text-xs text-slate-600">Publicidad segmentada apoyada en acuerdos de cobro conjunto con servicios móviles y de banda ancha.</p>
                            </div>
                            <div className="col-span-1 md:col-span-2 bg-slate-50 p-5 rounded-xl border-l-4 border-amber-500 shadow-sm hover:shadow-md transition-shadow">
                                <h4 className="font-bold text-amber-700 mb-1 text-sm">Reconfiguración del poder en el mercado publicitario</h4>
                                <p className="text-xs text-slate-600">Nuevas relaciones entre plataformas, programadores y anunciantes, con riesgos de concentración y barreras para medios locales.</p>
                            </div>
                        </div>
                    </SlideLayout>
                )
            },
            {
                id: 'av-conclusions',
                section: SectionType.AUDIOVISUAL,
                component: (
                    <SlideLayout title="Acciones para enfrentar y anticipar las tendencias tecnológicas en el sector audiovisual" chapter="Audiovisual">
                        <div className="mb-6"><p className="text-slate-700 mb-4">La gobernanza del ecosistema audiovisual no es un fin en sí mismo, sino el andamiaje para convertir innovaciones en garantías de derechos y pluralismo.</p></div>
                        <div className="grid grid-cols-2 gap-6">
                            <div className="bg-purple-50 p-5 rounded-lg"><h4 className="font-bold text-purple-800 mb-2 flex items-center gap-2"><Lightbulb size={20}/> Monitoreo y Prospectiva</h4><p className="text-sm text-slate-700">Consolidar sistemas de información sobre consumo y sostenibilidad. Desarrollar hojas de ruta tecnológicas anticipatorias.</p></div>
                            <div className="bg-blue-50 p-5 rounded-lg"><h4 className="font-bold text-blue-800 mb-2 flex items-center gap-2"><ShieldCheck size={20}/> Herramientas Técnicas</h4><p className="text-sm text-slate-700">Capacidades para auditoría algorítmica y evaluación de sistemas de recomendación. Adopción de estándares como C2PA para autenticidad.</p></div>
                            <div className="bg-indigo-50 p-5 rounded-lg"><h4 className="font-bold text-indigo-800 mb-2 flex items-center gap-2"><Users size={20}/> Co-regulación</h4><p className="text-sm text-slate-700">Esquemas de corresponsabilidad con la industria: códigos de conducta, interoperabilidad de verificación de edad y transparencia publicitaria.</p></div>
                            <div className="bg-green-50 p-5 rounded-lg"><h4 className="font-bold text-green-800 mb-2 flex items-center gap-2"><Globe size={20}/> Agenda Pública</h4><p className="text-sm text-slate-700">Integrar alfabetización digital y métricas de eficiencia energética en el otorgamiento de licencias y espectro.</p></div>
                        </div>
                    </SlideLayout>
                )
            },
            // OUTRO
            {
                id: 'outro',
                section: SectionType.OUTRO,
                component: (
                    <SlideLayout isCover>
                        <h1 className="text-6xl font-bold mb-4">¡Gracias!</h1>
                        <div className="bg-white/10 p-8 rounded-2xl backdrop-blur-md max-w-2xl w-full flex flex-col items-center">
                            <p className="text-2xl mb-2 font-bold text-white">Comisión de Regulación de Comunicaciones</p>
                            <p className="text-xl text-white/90 font-light">Coordinación de Prospectiva Estratégica e Innovación</p>
                            <div className="h-px bg-white/30 w-1/2 my-6"></div>
                            <div className="bg-white p-4 rounded-xl">
                                <img src="logo.png" alt="Logo CRC" className="h-24 object-contain" />
                            </div>
                        </div>
                    </SlideLayout>
                )
            }
        ];

        // --- 6. APP PRINCIPAL ---
        const App = () => {
            const [activeSection, setActiveSection] = useState(SectionType.INTRO);
            const mainContentRef = useRef(null);

            const sectionSlides = slides.filter(slide => slide.section === activeSection);

            const handleSectionJump = (section) => {
                setActiveSection(section);
                if (mainContentRef.current) {
                    mainContentRef.current.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            const handleNextSection = () => {
                const currentIndex = SECTION_ORDER.indexOf(activeSection);
                if (currentIndex < SECTION_ORDER.length - 1) {
                    handleSectionJump(SECTION_ORDER[currentIndex + 1]);
                }
            };

            const currentSectionIndex = SECTION_ORDER.indexOf(activeSection);
            const nextSection = currentSectionIndex < SECTION_ORDER.length - 1 ? SECTION_ORDER[currentSectionIndex + 1] : null;
            const progress = ((currentSectionIndex + 1) / SECTION_ORDER.length) * 100;

            const Navigation = ({ currentSection, onSectionClick, progress }) => {
              const items = [
                { type: SectionType.INTRO, Icon: Icons.Home, label: 'Inicio' },
                { type: SectionType.TELECOM, Icon: Icons.Radio, label: 'Telecom' },
                { type: SectionType.POSTAL, Icon: Icons.Mail, label: 'Postal' },
                { type: SectionType.AUDIOVISUAL, Icon: Icons.Video, label: 'Audiovisual' },
                { type: SectionType.OUTRO, Icon: Icons.CheckCircle, label: 'Cierre' },
              ];

              return (
                <div className="fixed left-0 top-0 h-full w-20 bg-slate-900 flex flex-col items-center py-8 z-50 shadow-2xl border-r border-slate-800">
                  <div className="font-bold text-white text-xs mb-10 tracking-widest bg-indigo-600 px-2 py-1 rounded">CRC</div>
                  
                  <nav className="flex-1 flex flex-col gap-8 w-full px-2">
                    {items.map((item) => {
                      const isActive = currentSection === item.type;
                      return (
                        <button
                          key={item.type}
                          onClick={() => onSectionClick(item.type)}
                          className={`flex flex-col items-center gap-1 p-3 rounded-2xl transition-all duration-300 w-full group relative ${
                            isActive 
                              ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 translate-x-1' 
                              : 'text-slate-400 hover:text-white hover:bg-slate-800'
                          }`}
                          title={item.label}
                        >
                          <item.Icon size={24} strokeWidth={isActive ? 2.5 : 2} />
                          <span className="absolute left-full ml-4 px-3 py-1.5 bg-slate-800 text-white text-xs font-medium rounded-md opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap shadow-xl z-50 pointer-events-none">
                            {item.label}
                            <span className="absolute left-0 top-1/2 -translate-x-1 -translate-y-1/2 w-2 h-2 bg-slate-800 rotate-45"></span>
                          </span>
                        </button>
                      );
                    })}
                  </nav>

                  <div className="w-full px-4 flex flex-col items-center gap-2">
                     <div className="text-[10px] text-slate-500 font-mono">{Math.round(progress)}%</div>
                     <div className="h-24 w-1.5 bg-slate-800 rounded-full overflow-hidden relative">
                        <div className="absolute bottom-0 left-0 w-full bg-gradient-to-t from-indigo-500 to-purple-500 transition-all duration-500 ease-out" style={{ height: `${progress}%` }} />
                     </div>
                  </div>
                </div>
              );
            };

            return (
                <div className="flex h-screen w-screen overflow-hidden bg-slate-100 font-sans text-slate-900">
                    <Navigation currentSection={activeSection} onSectionClick={handleSectionJump} progress={progress} />

                    <main ref={mainContentRef} className="snap-container flex-1 ml-20">
                        <div className="w-full">
                            {sectionSlides.map((slide, index) => {
                                const prevSlide = sectionSlides[index - 1];
                                const nextSlide = sectionSlides[index + 1];
                                return (
                                    <div key={slide.id} id={slide.id} className="snap-child relative w-full flex flex-col items-center justify-center p-4 md:p-8 lg:p-12 overflow-hidden bg-slate-50">
                                        <div className="w-full max-w-[1400px] h-full flex flex-col justify-center relative z-0">
                                            {slide.component}
                                        </div>
                                        <InternalNavigation prevId={prevSlide?.id} nextId={nextSlide?.id} />
                                    </div>
                                );
                            })}
                            
                            {nextSection && (
                                <div className="snap-child w-full flex items-center justify-center bg-slate-100">
                                    <SectionNavigation onNext={handleNextSection} nextSectionTitle={nextSection} />
                                </div>
                            )}

                            {activeSection === SectionType.OUTRO && (
                                <footer className="snap-start py-12 text-center text-slate-400 text-sm">
                                    &copy; 2025 Comisión de Regulación de Comunicaciones. Todos los derechos reservados.
                                </footer>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
